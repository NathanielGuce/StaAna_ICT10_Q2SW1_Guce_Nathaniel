<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
</head>
<style>
    .thing {
        text-align: center;
        background-color: #3a95ef;
    }
    .container {
        max-width: 600px;
        background-color: #087df2;
    }
    .result {
        text-align: center;
        background-color: #82b7ec;
    }
    body {
        background-color: #0a4cd1;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    py-script {
        display: none;
    }
</style>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Best Club in the Galaxy</a>
        </div>
    </nav>

    <div class="container mt-5" id="Thing">
        <h1 class="text-center">Insert Your Name to determine whether you are a member of the club</h1>
    </div>

    <form class="container mt-5" id="candidateform">
        <div class="mb-3">
            <label for="candidateName" class="form-label">Candidate Name</label>
            <input type="text" class="form-control" id="candidateName" placeholder="Enter candidate name">
        </div>
        <button class="btn btn-primary" id="checkButton" pyclick="checkbutton()">Are you sure you wanna know?</button><br><br>
    </form>

    <div id="result_checker" class="mt-3">
        <h3 class="text-center">Result will be displayed here</h3>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
